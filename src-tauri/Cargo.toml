[package]
name = "digitale-leerling"
version = "0.4.0"
description = "Digitale Leerling"
authors = ["Q"]
edition = "2021"

[lib]
name = "digitale_leerling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
