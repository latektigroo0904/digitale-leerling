name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src-tauri/**"
      - "package.json"
      - ".github/workflows/android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select latest installed Android NDK
        shell: bash
        run: |
          echo "NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install dependencies
        run: npm install

      - name: Initialize Tauri Android project
        run: npm run tauri -- android init --ci

      - name: Build debug APK
        run: npm run tauri -- android build --ci --debug --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: digitale-leerling-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
